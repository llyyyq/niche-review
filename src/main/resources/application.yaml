server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://your-ip:3306/hmdp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: name
    password: your-password
  redis:
    host: your-ip
    port: 6379
    password: your-password
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    # 默认保留业务 INFO/WARN/ERROR，避免定时任务的 MyBatis DEBUG SQL 淹没异常
    com.hmdp: info
    com.hmdp.mapper: warn
    org.springframework.context.support.PostProcessorRegistrationDelegate: warn
    org.apache.rocketmq.spring: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:-} traceId=%X{traceId:-} spanId=%X{spanId:-}] %logger{40} - %msg%n"

# RocketMQ配置
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: hmdp-producer-group

ai:
  chat:
    provider: mock
    stream-timeout-ms: 120000
    context-message-limit: 6
    system-prompt: "You are the Niche Review local-life assistant. Be concise and honest."
  embedding:
    provider: disabled
    dimension: 1024
  query-rewrite:
    enabled: true
    max-query-chars: 160
    max-tasks: 3
    max-attempts: 2
    context-message-limit: 4
    max-context-chars: 2400
    read-timeout-ms: 15000
  knowledge:
    shop-collection: shop_knowledge
    blog-collection: blog_knowledge
    vector-candidate-limit: 10
    task-candidate-limit: 5
    rebuild-on-start: false
    incremental-sync-enabled: true
    sync-retry-max-attempts: 5
    sync-retry-base-delay-seconds: 10
    sync-retry-scan-delay-ms: 10000
    sync-processing-timeout-seconds: 120
    vector-min-score: 0.35
  memory:
    summary-trigger-message-count: 12
    max-summary-chars: 2400
    max-summary-source-chars: 12000
    max-recent-message-chars: 6000
    max-knowledge-chars: 6000
    max-tool-result-chars: 4000
  evaluation:
    enabled: false
    # Disabled by default: every case is executed through the real chat service and model.
    conversation-enabled: false
    conversation-user-id:
    conversation-cases-path: docs/project-proof/rag-conversation-holdout.csv
    conversation-cases-split: HOLDOUT
    conversation-expected-case-count: 40
    # Metrics reruns must not overwrite the manually reviewed historical evidence.
    conversation-output-path: docs/project-proof/rag-conversation-holdout-result.csv
    conversation-report-path: docs/project-proof/rag-conversation-holdout-report.md
    conversation-title-prefix: "[E2E-EVAL]"
    conversation-turn-timeout-ms: 150000
  trace:
    enabled: true
    retention-days: 30
    cleanup-batch-size: 500
    cleanup-cron: "0 20 3 * * ?"
