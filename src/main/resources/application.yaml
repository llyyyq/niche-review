server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://your-ip:3306/hmdp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: name
    password: your-password
  redis:
    host: your-ip
    port: 6379
    password: your-password
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug

# RocketMQ配置
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: hmdp-producer-group

ai:
  chat:
    provider: mock
    stream-timeout-ms: 120000
    context-message-limit: 6
    system-prompt: "You are the Niche Review local-life assistant. Be concise and honest."
  embedding:
    provider: disabled
    dimension: 1024
  query-rewrite:
    enabled: true
    long-query-threshold-chars: 160
    max-query-chars: 160
    max-sub-queries: 3
    context-message-limit: 4
    max-context-chars: 2400
    max-output-tokens: 256
    read-timeout-ms: 8000
  knowledge:
    shop-collection: shop_knowledge
    retrieve-limit: 3
    rebuild-on-start: false
    incremental-sync-enabled: true
    sync-retry-max-attempts: 5
    sync-retry-base-delay-seconds: 10
    sync-retry-scan-delay-ms: 10000
    sync-processing-timeout-seconds: 120
    keyword-fallback-enabled: true
    vector-min-score: 0.35
    keyword-fallback-limit: 3
  agent:
    enabled: true
    max-steps: 1
    max-tools-per-step: 3
    fast-path-enabled: true
  memory:
    summary-trigger-message-count: 12
    max-summary-chars: 2400
    max-summary-source-chars: 12000
    max-recent-message-chars: 6000
    max-knowledge-chars: 6000
    max-tool-result-chars: 4000
  evaluation:
    enabled: false
    mode: rag
    rag-cases-path: docs/project-proof/rag-cases.csv
    query-rewrite-cases-path: docs/project-proof/query-rewrite-cases.csv
    query-rewrite-report-path: docs/project-proof/query-rewrite-evaluation.md
